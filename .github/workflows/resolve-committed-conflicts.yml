name: Resolve committed merge conflicts

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'agent/resolve-merge-conflicts'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Keep HEAD sections and remove conflict markers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []

          def resolve_ours(text: str, path: str) -> tuple[str, bool]:
              output = []
              state = "normal"
              modified = False

              for line in text.splitlines(keepends=True):
                  marker = line.rstrip("\r\n")

                  if state == "normal":
                      if marker.startswith("<<<<<<< "):
                          state = "ours"
                          modified = True
                      else:
                          output.append(line)
                  elif state == "ours":
                      if marker.startswith("||||||| "):
                          state = "base"
                      elif marker == "=======":
                          state = "theirs"
                      else:
                          output.append(line)
                  elif state == "base":
                      if marker == "=======":
                          state = "theirs"
                  elif state == "theirs":
                      if marker.startswith(">>>>>>> "):
                          state = "normal"

              if state != "normal":
                  raise RuntimeError(f"Unclosed conflict block in {path}")

              return "".join(output), modified

          for raw_path in tracked:
              if not raw_path:
                  continue

              path = Path(raw_path.decode("utf-8"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              resolved, modified = resolve_ours(text, str(path))
              if modified:
                  path.write_text(resolved, encoding="utf-8", newline="")
                  changed.append(str(path))

          env_example = """APP_NAME=drgEkspedisi
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost:8000

          APP_LOCALE=id
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=id_ID
          APP_TIMEZONE=Asia/Jakarta

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=drg_ekspedisi
          DB_USERNAME=root
          DB_PASSWORD=

          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=public

          MAIL_MAILER=log
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_ENCRYPTION=null
          MAIL_FROM_ADDRESS="cs@drgekspedisi.id"
          MAIL_FROM_NAME="${APP_NAME}"

          RECAPTCHA_SITE_KEY=
          RECAPTCHA_SECRET_KEY=
          RECAPTCHA_SECRET=
          RECAPTCHA_MIN_SCORE=0.5

          MIDTRANS_MERCHANT_ID=
          MIDTRANS_SERVER_KEY=
          MIDTRANS_CLIENT_KEY=
          MIDTRANS_IS_PRODUCTION=false

          VITE_APP_NAME="${APP_NAME}"
          """
          env_example = "\n".join(line.strip() for line in env_example.splitlines()).strip() + "\n"
          Path(".env.example").write_text(env_example, encoding="utf-8", newline="")
          if ".env.example" not in changed:
              changed.append(".env.example")

          print(f"Resolved {len(changed)} files:")
          for path in changed:
              print(f"- {path}")
          PY

      - name: Verify conflict markers are gone
        shell: bash
        run: |
          if git grep -n -e '^<<<<<<< ' -e '^>>>>>>> '; then
            echo 'Conflict markers remain.' >&2
            exit 1
          fi

      - name: Check PHP syntax
        shell: bash
        run: |
          if command -v php >/dev/null 2>&1; then
            find app bootstrap config database routes tests -type f -name '*.php' -print0 2>/dev/null \
              | xargs -0 -r -n1 php -l
          else
            echo 'PHP is not installed on this runner; syntax check skipped.'
          fi

      - name: Commit resolved files and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/resolve-committed-conflicts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resolve committed merge conflicts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
